<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b8cff">
  <title>COACH</title>
  <link rel="icon" type="image/jpeg" href="coach-logo.jpg">
  <link rel="apple-touch-icon" href="coach-logo.jpg">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
    #splash{position:fixed;inset:0;display:grid;place-items:center;background:#fff;z-index:2;transition:opacity .25s ease}
    #splash.hide{opacity:0;pointer-events:none}
    .wrap{text-align:center;color:#0f172a}.wrap img{width:128px;height:128px;border-radius:50%;object-fit:cover;box-shadow:0 12px 30px rgba(15,23,42,.16)}
    .wrap h1{margin:14px 0 4px;font-size:26px}.wrap p{margin:0;color:#64748b;font-size:13px}
    iframe{border:0;width:100%;height:100%;display:block;background:#f4f6f8}
  </style>
</head>
<body>
  <div id="splash"><div class="wrap"><img src="coach-logo.jpg" alt="COACH logo"><h1>COACH</h1><p>Complaint Address Monitor</p></div></div>
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbyh8xuVxDSD6aFyr3EyQq6gfpMqXIUjLK-_VXaZSyjdml6fH6OajtTEsJtq0GOb87A/exec" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const frame=document.getElementById('app');
    const splash=document.getElementById('splash');
    frame.addEventListener('load',()=>setTimeout(()=>splash.classList.add('hide'),250));
    setTimeout(()=>splash.classList.add('hide'),5000);
  </script>
</body>
</html>
