<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root{--bg:#f4f6f8;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--dark:#111827;--warn:#b42318;--warn-bg:#fff3f2;--blue:#2563eb;--shadow:0 8px 26px rgba(15,23,42,.08)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    button,input,textarea,select{font:inherit}
    .app{max-width:820px;margin:0 auto;min-height:100vh;padding:18px 16px 120px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:900}.title h1{margin:0;font-size:21px}.title p{margin:3px 0 0;color:var(--muted);font-size:12px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}
    .page{display:none}.page.active{display:block}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.stat,.section{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:16px}.stat .label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}.stat .value{font-size:30px;font-weight:900;margin-top:7px}.section{padding:16px;margin-bottom:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section h2{font-size:16px;margin:0}.badge{background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}
    .filter{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;margin-bottom:12px}
    .list{display:grid;gap:10px}.card{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff}.alert-card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}.driver{font-size:12px;color:var(--blue);font-weight:900;text-transform:uppercase;margin-bottom:6px}.addr{font-size:15px;font-weight:900}.stop{display:inline-block;margin-right:7px;background:#111827;color:#fff;border-radius:8px;padding:4px 7px;font-size:11px}.details{font-size:13px;line-height:1.45;color:#334155;margin-top:8px;white-space:pre-wrap}.meta{font-size:11px;color:var(--muted);margin-top:8px}.empty{border:1px dashed #cbd5e1;border-radius:15px;padding:22px;text-align:center;color:var(--muted)}
    .donebtn{width:42px;height:42px;border:none;border-radius:12px;background:#ecfdf3;color:#067647;font-size:19px;cursor:pointer;display:grid;place-items:center}.donebtn:hover{background:#d1fadf}.donebtn:disabled{opacity:.5;cursor:wait}
    .db-toolbar{display:flex;gap:8px;margin-bottom:12px}.db-toolbar input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 12px}.actions{display:flex;gap:8px;margin-top:12px}.smallbtn{border:none;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer}.editbtn{background:#eef2ff;color:#3730a3}.deletebtn{background:#fff1f2;color:#be123c}
    .fab{position:fixed;right:max(20px,calc((100vw - 820px)/2 + 20px));bottom:78px;width:58px;height:58px;border-radius:50%;border:none;background:var(--dark);color:#fff;font-size:32px;box-shadow:0 14px 28px rgba(15,23,42,.26);cursor:pointer;z-index:8}
    .bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(820px,100%);height:64px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;z-index:7}.navbtn{border:none;background:#fff;color:var(--muted);font-weight:800;cursor:pointer}.navbtn.active{color:var(--dark)}
    .overlay{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;align-items:flex-end;justify-content:center;z-index:20}.overlay.show{display:flex}.sheet{width:min(820px,100%);background:#fff;border-radius:24px 24px 0 0;padding:18px 16px 28px;max-height:92vh;overflow:auto}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.modal-head h3{margin:0}.close{width:36px;height:36px;border:none;border-radius:50%;background:#f1f5f9;cursor:pointer}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:13px;padding:12px 13px;outline:none}.field textarea{min-height:125px;resize:vertical}.primary{width:100%;border:none;border-radius:13px;padding:13px;background:var(--dark);color:#fff;font-weight:900;cursor:pointer}.primary:disabled{opacity:.55}.conflictbox{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:13px;margin-bottom:14px}.conflictbox strong{display:block;margin-bottom:6px}.conflict-actions{display:grid;gap:8px}.conflict-actions button{border:none;border-radius:12px;padding:12px;font-weight:900;cursor:pointer}.overwrite{background:#fee2e2;color:#991b1b}.append{background:#dcfce7;color:#166534}.cancel{background:#e2e8f0;color:#334155}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#111827;color:#fff;border-radius:12px;padding:11px 14px;display:none;z-index:40;max-width:calc(100vw - 32px);text-align:center}.toast.show{display:block}.toast.error{background:#b42318}
    @media(max-width:520px){.stats{grid-template-columns:1fr}.fab{right:20px}.actions{flex-wrap:wrap}.alert-card{grid-template-columns:1fr auto}}
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand"><div class="logo">C</div><div class="title"><h1>COACH</h1><p>Complaint Address Monitor</p></div></div>
      <button class="iconbtn" onclick="refreshCurrent()">↻</button>
    </div>

    <section id="homePage" class="page active">
      <div class="stats">
        <div class="stat"><div class="label">Complaint addresses</div><div class="value" id="totalComplaints">—</div></div>
        <div class="stat"><div class="label">Pending stops</div><div class="value" id="totalAlerts">—</div></div>
      </div>
      <div class="section">
        <div class="section-head"><h2>⚠️ Pending stops</h2><span class="badge" id="alertBadge">0 stops</span></div>
        <select class="filter" id="driverFilter" onchange="renderAlerts()"><option value="">All drivers</option></select>
        <div id="alertsContainer" class="empty">Loading...</div>
      </div>
      <div class="section">
        <div class="section-head"><h2>Recently added</h2></div>
        <div id="recentContainer" class="empty">Loading...</div>
      </div>
    </section>

    <section id="databasePage" class="page">
      <div class="section">
        <div class="section-head"><h2>🗂️ Address database</h2><span class="badge" id="dbCount">0</span></div>
        <div class="db-toolbar"><input id="dbSearch" placeholder="Search address or notes..." oninput="renderDatabase()"></div>
        <div id="databaseContainer" class="empty">Loading...</div>
      </div>
    </section>
  </main>

  <button class="fab" onclick="openAdd()">+</button>
  <nav class="bottomnav">
    <button id="navHome" class="navbtn active" onclick="showPage('home')">🏠 Home</button>
    <button id="navDatabase" class="navbtn" onclick="showPage('database')">🗂️ Database</button>
  </nav>

  <div class="overlay" id="formOverlay" onclick="if(event.target===this) closeForm()">
    <div class="sheet">
      <div class="modal-head"><h3 id="formTitle">New complaint address</h3><button class="close" onclick="closeForm()">×</button></div>
      <input type="hidden" id="editId">
      <div class="field"><label>Address</label><input id="address" autocomplete="street-address" placeholder="123 Main St, Jacksonville, FL"></div>
      <div class="field"><label>Notes / complaint details</label><textarea id="details" placeholder="What should the driver be careful about?"></textarea></div>
      <button class="primary" id="saveBtn" onclick="saveForm()">Save address</button>
    </div>
  </div>

  <div class="overlay" id="conflictOverlay">
    <div class="sheet">
      <div class="modal-head"><h3>Address already exists</h3><button class="close" onclick="cancelConflict()">×</button></div>
      <div class="conflictbox">
        <strong id="conflictAddress"></strong>
        <div class="meta">Current notes</div>
        <div class="details" id="conflictExisting"></div>
        <div class="meta" style="margin-top:12px">New notes</div>
        <div class="details" id="conflictIncoming"></div>
      </div>
      <div class="conflict-actions">
        <button class="overwrite" onclick="resolveConflict('overwrite')">Overwrite — replace the old record</button>
        <button class="append" onclick="resolveConflict('add')">Add — keep it and add these notes</button>
        <button class="cancel" onclick="cancelConflict()">Cancel — make no changes</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let homeData={alerts:[],recent:[],drivers:[]};
    let dbData=[];
    let pendingDuplicate=null;

    document.addEventListener('DOMContentLoaded',()=>{loadHome();loadDatabase();});

    function showPage(page){
      const home=page==='home';
      document.getElementById('homePage').classList.toggle('active',home);
      document.getElementById('databasePage').classList.toggle('active',!home);
      document.getElementById('navHome').classList.toggle('active',home);
      document.getElementById('navDatabase').classList.toggle('active',!home);
      if(!home) loadDatabase();
    }

    function refreshCurrent(){
      if(document.getElementById('homePage').classList.contains('active')) loadHome();
      else loadDatabase();
    }

    function loadHome(){
      google.script.run.withSuccessHandler(data=>{
        homeData=data||{alerts:[],recent:[],drivers:[]};
        document.getElementById('totalComplaints').textContent=homeData.totalComplaints||0;
        renderDriverFilter();renderAlerts();renderRecent();
      }).withFailureHandler(err=>showToast(errorMessage(err),true)).getHomeData();
    }

    function renderDriverFilter(){
      const sel=document.getElementById('driverFilter');
      const current=sel.value;
      sel.innerHTML='<option value="">All drivers</option>'+(homeData.drivers||[]).map(d=>`<option value="${escAttr(d)}">${esc(d)}</option>`).join('');
      if([...sel.options].some(o=>o.value===current)) sel.value=current;
    }

    function renderAlerts(){
      const selected=document.getElementById('driverFilter').value;
      const alerts=(homeData.alerts||[]).filter(a=>!selected||a.driver===selected);
      document.getElementById('totalAlerts').textContent=(homeData.alerts||[]).length;
      document.getElementById('alertBadge').textContent=`${alerts.length} ${alerts.length===1?'stop':'stops'}`;
      const box=document.getElementById('alertsContainer');
      if(!alerts.length){box.className='empty';box.innerHTML='<strong>No pending complaint stops.</strong><br>Completed stops disappear from this list.';return;}
      box.className='list';
      box.innerHTML=alerts.map((a,i)=>`
        <div class="card alert-card">
          <div>
            <div class="driver">${esc(a.driver)}</div>
            <div class="addr"><span class="stop">STOP ${esc(a.stop)}</span>${esc(a.address)}</div>
            <div class="details">${esc(a.details)}</div>
          </div>
          <button class="donebtn" id="done_${i}" onclick="markDone(${i}, this)" title="Driver completed this stop" aria-label="Mark stop done">🗑️</button>
        </div>`).join('');
      window.__visibleAlerts=alerts;
    }

    function markDone(index,btn){
      const a=(window.__visibleAlerts||[])[index];
      if(!a)return;
      btn.disabled=true;
      google.script.run.withSuccessHandler(()=>{
        showToast('Stop completed.');
        loadHome();
      }).withFailureHandler(err=>{btn.disabled=false;showToast(errorMessage(err),true);}).markStopDone({
        driver:a.driver,
        stop:a.stop,
        address:a.address,
        normalizedAddress:a.normalizedAddress||''
      });
    }

    function renderRecent(){
      const box=document.getElementById('recentContainer');
      const rows=homeData.recent||[];
      if(!rows.length){box.className='empty';box.textContent='No complaint addresses yet.';return;}
      box.className='list';box.innerHTML=rows.map(r=>`<div class="card"><div class="addr">${esc(r.address)}</div><div class="details">${esc(r.details)}</div><div class="meta">${esc(r.date||'')}</div></div>`).join('');
    }

    function loadDatabase(){
      google.script.run.withSuccessHandler(rows=>{dbData=rows||[];renderDatabase();}).withFailureHandler(err=>showToast(errorMessage(err),true)).getComplaints();
    }

    function renderDatabase(){
      const q=(document.getElementById('dbSearch').value||'').trim().toLowerCase();
      const rows=dbData.filter(r=>!q||`${r.address} ${r.details}`.toLowerCase().includes(q));
      document.getElementById('dbCount').textContent=`${dbData.length} addresses`;
      const box=document.getElementById('databaseContainer');
      if(!rows.length){box.className='empty';box.textContent=q?'No results.':'The database is empty.';return;}
      box.className='list';box.innerHTML=rows.map(r=>`<div class="card"><div class="addr">${esc(r.address)}</div><div class="details">${esc(r.details)}</div><div class="meta">${esc(r.date||'')}</div><div class="actions"><button class="smallbtn editbtn" onclick="openEdit('${escJs(r.id)}')">✏️ Edit</button><button class="smallbtn deletebtn" onclick="removeAddress('${escJs(r.id)}','${escJs(r.address)}')">🗑️ Delete</button></div></div>`).join('');
    }

    function openAdd(){
      document.getElementById('formTitle').textContent='New complaint address';
      document.getElementById('editId').value='';
      document.getElementById('address').value='';
      document.getElementById('details').value='';
      document.getElementById('saveBtn').textContent='Save address';
      document.getElementById('formOverlay').classList.add('show');
      setTimeout(()=>document.getElementById('address').focus(),120);
    }

    function openEdit(id){
      const r=dbData.find(x=>x.id===id);if(!r)return;
      document.getElementById('formTitle').textContent='Edit complaint address';
      document.getElementById('editId').value=r.id;
      document.getElementById('address').value=r.address||'';
      document.getElementById('details').value=r.details||'';
      document.getElementById('saveBtn').textContent='Save changes';
      document.getElementById('formOverlay').classList.add('show');
    }

    function closeForm(){document.getElementById('formOverlay').classList.remove('show');}

    function saveForm(){
      const id=document.getElementById('editId').value;
      const address=document.getElementById('address').value.trim();
      const details=document.getElementById('details').value.trim();
      const btn=document.getElementById('saveBtn');
      if(!address)return showToast('Enter the address.',true);
      if(!details)return showToast('Enter the notes.',true);
      btn.disabled=true;

      const success=res=>{
        btn.disabled=false;
        if(res&&res.conflict){
          pendingDuplicate={address,details};
          closeForm();
          document.getElementById('conflictAddress').textContent=res.existing.address||address;
          document.getElementById('conflictExisting').textContent=res.existing.details||'';
          document.getElementById('conflictIncoming').textContent=details;
          document.getElementById('conflictOverlay').classList.add('show');
          return;
        }
        closeForm();showToast(id?'Changes saved.':'Address saved.');loadHome();loadDatabase();
      };
      const fail=err=>{btn.disabled=false;showToast(errorMessage(err),true);};

      if(id) google.script.run.withSuccessHandler(success).withFailureHandler(fail).updateComplaint({id,address,details});
      else google.script.run.withSuccessHandler(success).withFailureHandler(fail).addComplaint({address,details});
    }

    function resolveConflict(action){
      if(!pendingDuplicate)return cancelConflict();
      const payload={...pendingDuplicate,duplicateAction:action};
      google.script.run.withSuccessHandler(()=>{
        pendingDuplicate=null;document.getElementById('conflictOverlay').classList.remove('show');
        showToast(action==='overwrite'?'Old record replaced.':'Notes added to existing address.');loadHome();loadDatabase();
      }).withFailureHandler(err=>showToast(errorMessage(err),true)).addComplaint(payload);
    }

    function cancelConflict(){pendingDuplicate=null;document.getElementById('conflictOverlay').classList.remove('show');showToast('No changes made.');}

    function removeAddress(id,address){
      if(!confirm(`Delete this address?\n\n${address}`))return;
      google.script.run.withSuccessHandler(()=>{showToast('Address deleted.');loadHome();loadDatabase();}).withFailureHandler(err=>showToast(errorMessage(err),true)).deleteComplaint(id);
    }

    function showToast(message,isError){const t=document.getElementById('toast');t.textContent=message;t.className=`toast show${isError?' error':''}`;clearTimeout(window.__t);window.__t=setTimeout(()=>t.className='toast',2600);}
    function errorMessage(err){return err&&err.message?err.message:String(err||'Something went wrong.');}
    function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
    function escAttr(v){return esc(v);}
    function escJs(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ');}
  </script>
</body>
</html>
